name: gym_tracker_app
description: "GymTracker - App per gestione allenamenti in palestra"
publish_to: 'none'
version: 1.2.46

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1

  # Immutable models
  freezed_annotation: ^2.4.4

  # Local storage (IndexedDB on web)
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.69.0

  # Navigation
  go_router: ^14.8.1

  # Typography
  google_fonts: ^6.2.1

  # Date formatting
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.5.3

  # JSON serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.7
  build_runner: ^2.4.13
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
